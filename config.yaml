# =============================================================================
# config.yaml
#
# PURPOSE
#   Hold every analysis choice in one file. No script contains a hard-coded
#   threshold. To change the analysis, edit this file and rerun ./run_all.sh
#
# RULE
#   If a number affects a result, it belongs here. Do not put a number in a
#   script.
# =============================================================================

# -----------------------------------------------------------------------------
# Reproducibility
# -----------------------------------------------------------------------------
seed: 42                  # Used by every random operation in the pipeline.

# -----------------------------------------------------------------------------
# The species
#
# aa = Ara ambiguus (great green macaw). 8 birds. One call type.
# ag = Ara glaucogularis (blue-throated macaw). 16 birds. 8 call types.
# -----------------------------------------------------------------------------
species: [aa, ag]

# -----------------------------------------------------------------------------
# The subsets
#
# A subset is a group of birds that is scored together.
#
# ag needs two subsets, because the birds are not all housed together. Birds in
# separate rooms can be told apart by the room instead of the voice. The 'lab'
# subset holds only the birds that share one room, so the room cannot stand in
# for the identity. Report 'lab' as the primary ag result. Report 'all' as an
# optimistic upper bound.
# -----------------------------------------------------------------------------
subsets:
  aa:
    all: null                              # No filter. All 8 birds.
  ag:
    all: null                              # No filter. All 16 birds.
    lab: {environment_class: lab}          # The 12 birds that share one room.

# -----------------------------------------------------------------------------
# The call set
#
# The analysis uses single calls only, for both species. One clip holds one
# call. This is the matched unit across the two species.
#
# WHY THE MATCHED UNIT MATTERS
#   The aa collection also holds 255 repeated call bouts. A bout holds several
#   calls, so it gives the model more acoustic material. Adding the bouts raises
#   aa accuracy by 0.03 to 0.07 (perch_bird 0.610 to 0.678, birdnet 0.619 to
#   0.647).
#
#   ag has no bouts. If aa used bouts and ag did not, part of the reported
#   difference between the two species would come from the acoustic unit rather
#   than from the biology. The headline result of the paper is that aa is easier
#   than ag, so that difference must not be manufactured by the call set.
#
#   The bouts are published as a supplementary set and analysed separately. See
#   supplementary_call_sets below.
# -----------------------------------------------------------------------------
call_set: single

# The supplementary analysis. This runs only when the supplementary audio is
# present. It answers one question: does more acoustic material for each
# detection improve identification? It never enters the cross-species
# comparison.
supplementary_call_sets:
  aa_repeated_bouts:
    species: aa
    kind: repeated
    purpose: >
      Sensitivity check on the amount of acoustic material for each detection.
      Reported in the supplement only. Excluded from every main result and from
      every cross-species comparison.

# -----------------------------------------------------------------------------
# The train and test split
#
# The split groups on recording_id. Calls from one recording never appear in
# both the train set and the test set.
#
# This is the most important choice in the analysis. Recordings carry an
# acoustic signature. Within one bird, a model identifies the recording at 2.7
# to 3.7 times chance. If one recording appears on both sides of the split, the
# model uses that signature instead of the voice.
#
# The pipeline reports the random split as well. That result is too high. The
# difference between the two splits is the leakage delta.
# -----------------------------------------------------------------------------
split:
  n_folds: 5
  group_by: recording_id
  report_random_baseline: true

# -----------------------------------------------------------------------------
# Excluded clips: NONE.
#
# The pipeline does not exclude any clip. Every clip in the dataset is analysed.
#
# Two files were found to be segmentation errors and were removed from the
# PUBLISHED DATASET rather than filtered here:
#   acorn_upstaris_240517_0777  (aa)  111 s, one continuous recording.
#   john_241004_doublese_01     (ag)  19.1 s, 21x the median doublese call and
#                                     13x the next longest ag clip.
#
# Removing bad data from the dataset, rather than hiding it behind a filter,
# means the published dataset is exactly what was analysed. See the dataset
# README for the record.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# The model panel
#
# One entry for each representation. This block is the source for the model
# description table in the manuscript.
#
# family        Groups the panel for reporting. Six families:
#                 bird_supervised   Trained to classify bird species.
#                 animal_ssl        Self-supervised on animal or general audio,
#                                   HuBERT architecture.
#                 audio_ssl         Self-supervised on general audio.
#                 audio_text        Contrastive audio-text.
#                 speech_speaker    Human-speech speaker verification.
#                 handcrafted       The MFCC baseline.
# verify        true where the training corpus needs confirming from the primary
#               source before the manuscript states it. DO NOT publish a
#               training-corpus claim still marked verify: true.
#
# NOTE: an earlier version carried a xeno_canto flag for every model, to drive a
# pretraining-exposure control. It was removed. The control's validity depended
# on correctly classifying the training corpus of all 15 models, which is hard
# to establish and easy to get wrong, and the result was negative anyway. The
# control now uses only the two speech models, whose corpus is beyond doubt.
# See src/05_diagnostics.py, diagnostic 4.
# -----------------------------------------------------------------------------
models:
  birdnet:            {family: bird_supervised, cite: "Kahl et al. 2021", verify: false}
  perch_bird:         {family: bird_supervised, cite: "Google Perch 2023", verify: true}
  perch_v2:           {family: bird_supervised, cite: "Google Perch v2",   verify: true}
  surfperch:          {family: bird_supervised, cite: "Williams et al. 2024", verify: true}
  convnext_birdset:   {family: bird_supervised, cite: "Rauch et al. 2024 (BirdSet)", verify: true}
  audioprotopnet:     {family: bird_supervised, cite: "BirdSet AudioProtoPNet", verify: true}
  avesecho_passt:     {family: bird_supervised, cite: "AvesEcho PaSST", verify: true}
  birdmae:            {family: bird_supervised, cite: "Bird-MAE", verify: true}
  birdaves_especies:  {family: animal_ssl, cite: "Hagiwara 2023; BirdAVES 2024", verify: false}
  aves_especies:      {family: animal_ssl, cite: "Hagiwara 2023 (AVES)", verify: false}
  beats:              {family: audio_ssl, cite: "Chen et al. 2023 (BEATs)", verify: true}
  audiomae:           {family: audio_ssl, cite: "Huang et al. 2022 (AudioMAE)", verify: true}
  biolingual:         {family: audio_text, cite: "Robinson et al. 2024 (BioLingual)", verify: true}
  ecapa_tdnn:         {family: speech_speaker, cite: "Desplanques et al. 2020", verify: false}
  wavlm_base_plus_sv: {family: speech_speaker, cite: "Chen et al. 2022 (WavLM)", verify: false}
  mfcc_lakdari:       {family: handcrafted, cite: "Lakdari et al. 2024", verify: false}
  mfcc_full:          {family: handcrafted, cite: "this study", verify: false}
  mfcc_cmvn:          {family: handcrafted, cite: "this study", verify: false}

# NOTE ON wavlm_base_plus_sv: this is the SPEAKER-VERIFICATION fine-tuned
# variant, read at its final fixed-length output. Cauzinille et al. (2024) used
# plain WavLM Large at the SECOND transformer layer and found it strong for
# gibbon individual ID. Those are different configurations of the same family.
# State that difference rather than treating the two results as contradictory.

# -----------------------------------------------------------------------------
# The MFCC baseline
#
# The settings follow Lakdari et al. (2024), with three changes for this data.
#
# 1. The band is 500 to 8000 Hz, not their 400 to 1600 Hz. The band comes from
#    our own audio. Call energy sits between 1.3 and 5 kHz in both species
#    (5th to 95th percentile).
# 2. The sample rate is 16 kHz. The Nyquist frequency is then 8 kHz, which
#    matches the top of the band.
# 3. Their gibbon calls last 9 to 27 seconds. Ours last 0.39 +/- 0.11 s (aa)
#    and 0.58 +/- 0.20 s (ag), measured after the drop_clips exclusions. One
#    call gives 15 to 140 frames, so the standard deviation of each
#    coefficient is noisier than in their study. Report this limit.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Checkpoints that bacpipe does not fetch by itself
#
# bacpipe downloads the weights of most models on first use. BirdNET is the
# exception. Without this download the model writes zero embeddings and the run
# looks successful until 01b_verify_embeddings.py counts the files.
#
# src/01a_fetch_checkpoints.py reads this block and writes to
# bacpipe/model_checkpoints below the repository root, which is where bacpipe
# looks.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Padding
#
# The calls are short. Every Ara ambiguus clip is between 0.192 and 1.093
# seconds. BirdNET and WavLMForXVector both fail on the shortest of them, and
# BirdNET skips the clip rather than stopping, so the loss is silent.
#
# 00a_pad_audio.py adds trailing silence to any clip below min_seconds and
# copies the rest unchanged. Stage 1 and stage 2 both read the padded copy, so
# every representation sees the same audio.
#
# The rule is applied to both species. To pad one and not the other would put a
# preprocessing difference inside the species comparison, which is the main
# result of the paper. Report min_seconds in the methods.
# -----------------------------------------------------------------------------
padding:
  min_seconds: 1.0

checkpoints:
  birdnet:
    repo_id: vskode/bacpipe_models
    repo_type: dataset
    patterns:
      - birdnet/birdnetv2.4.keras
      - birdnet/BirdNET_Preprocessor/*
  beats:
    repo_id: vskode/bacpipe_models
    repo_type: dataset
    patterns:
      - beats/BEATs_iter3_plus_AS2M_finetuned_on_AS2M_cpt1.pt
    sha256:
      beats/BEATs_iter3_plus_AS2M_finetuned_on_AS2M_cpt1.pt:
        7f9362028ac6e5c049e8dc314d87e90e4f82a15a8e472deb56af55d7f9b34d6a

mfcc:
  sample_rate: 16000
  window_seconds: 0.025
  hop_seconds: 0.010
  fmin_hz: 500
  fmax_hz: 8000
  n_mels: 40
  variants:
    mfcc_lakdari:                # The formula of Lakdari et al. (2024).
      n_mfcc: 12
      deltas: false
      cmvn: false
    mfcc_full:                   # A modern version with more coefficients.
      n_mfcc: 20
      deltas: true
      cmvn: false
    mfcc_cmvn:                   # A control. See the caution below.
      n_mfcc: 20
      deltas: true
      cmvn: true

# CAUTION: Do not report mfcc_cmvn as a test of channel effects.
# CMVN removes the mean and variance of each recording. In this data, one
# recording holds one bird in most cases, so CMVN removes the bird as well as
# the channel. The variant shows only that the MFCC identity signal sits in the
# static spectral statistics of a recording. It cannot separate the voice from
# the channel. Use src/05_diagnostics.py for that comparison instead.

# -----------------------------------------------------------------------------
# The metric-learning head
#
# The head is deliberately small. A deep network learns the training calls
# instead of the general pattern when the training set is this small.
# The losses are supervised contrastive (Khosla et al. 2020) and prototypical
# (Snell et al. 2017). Triplet loss and ArcFace were tested and dropped.
# -----------------------------------------------------------------------------
metric_learning:
  projection_dim: 128
  pca_dim: null                  # Set an integer to reduce the input first.
  temperature: 0.1
  learning_rate: 0.01
  weight_decay: 0.001
  max_epochs: 200
  patience: 20                   # Stop when the score on a held-out slice
                                 # stops improving after this many epochs.
  losses: [proto, supcon]
  holdout_birds: 3               # Birds held out for each novel-individual repeat.
  holdout_repeats: 12
  knn_k: 5
  few_shot_shots: [1, 5]

# -----------------------------------------------------------------------------
# Clustering
#
# The pipeline runs three algorithms. KMeans receives the true number of birds.
# Affinity propagation and HDBSCAN infer the number of clusters, so they match
# the open-set case.
# -----------------------------------------------------------------------------
clustering:
  algorithms: [kmeans, affinity_propagation, hdbscan]
  affinity_propagation:
    damping: 0.9
    max_iter: 1000
    convergence_iter: 50
  hdbscan:
    min_cluster_size: 5
  metrics: [nmi, ami, ari, purity]
  report_inferred_k: true

# CAUTION: Do not report NMI on its own.
# NMI increases as the number of clusters increases. Affinity propagation
# infers 37 to 85 clusters for 8 to 16 birds. Its NMI is therefore higher than
# the NMI of KMeans, while its ARI is lower. Always report NMI next to AMI or
# ARI, and next to the inferred number of clusters.

# -----------------------------------------------------------------------------
# Baselines
#
# ag is not balanced. The number of calls for each bird runs from 41 to 108.
# Report the majority-class rate next to 1/n_birds. If you report 1/n_birds
# alone, the result looks better than it is.
#
# aa is balanced at 60 calls for each bird, so 1/n_birds is correct there.
# -----------------------------------------------------------------------------
baselines:
  report_inverse_n_birds: true
  report_majority_class: true

# -----------------------------------------------------------------------------
# Models that must run on CPU
#
# avesecho_passt moves the model to the device but not the input audio. On
# CUDA, every file fails and the model writes zero embeddings.
# -----------------------------------------------------------------------------
cpu_only_models:
  - avesecho_passt
