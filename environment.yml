# =============================================================================
# environment.yml
#
# PURPOSE
#   Pin every dependency, so a rerun uses the same versions.
#
# USAGE
#   conda env create -f environment.yml
#   conda activate parrot-id
#
#   On a machine with no conda, use requirements.txt and a virtual environment.
#   It holds the same set.
#
# WARNING
#   Do not run `pip install -U jax[cuda12]`. The -U flag upgrades numpy to
#   version 2, which breaks the pinned torch and bacpipe environment. JAX models
#   (perch_bird, perch_v2, surfperch) run on CPU by design. That is expected.
#
# NOTE
#   numpy is pinned below version 2. Several pinned packages fail on numpy 2.
# =============================================================================
name: parrot-id

channels:
  - conda-forge

dependencies:
  - python=3.10

  # Core numerical stack.
  - numpy<2
  - pandas=2.2.*
  - scipy=1.13.*
  - scikit-learn=1.5.*
  - pyyaml=6.*

  # Audio. librosa reads the audio files. soundfile is its file backend.
  - librosa=0.10.*
  - soundfile=0.12.*

  # Tests.
  - pytest=8.*

  - pip
  - pip:
      # Torch. The metric-learning head and the torch embedding models use it.
      # For a CUDA build other than the default wheel, install the matching
      # wheel from pytorch.org after you create the environment.
      - torch==2.3.1
      - torchaudio==2.3.1

      # The two speech speaker-verification models. ecapa_tdnn comes from
      # speechbrain. wavlm_base_plus_sv comes from transformers. Neither
      # carries a version here, because the version that produced the published
      # results is not yet recorded. Run 08_freeze_environment.py freeze to
      # write the resolved versions into environment.lock/.
      - speechbrain
      - transformers

      # bacpipe supplies the other 13 pre-trained embedding models.
      # CAUTION: bacpipe reads its device from settings.yaml inside the package.
      # It does not detect CUDA. run_all.sh sets that value.
      - bacpipe==0.1.0
